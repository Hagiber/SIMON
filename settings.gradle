pluginManagement {
    repositories {
        def repoMirrorUrl =
                providers.gradleProperty("repoMirrorUrl").orNull ?: System.getenv("GRADLE_REPO_MIRROR_URL")
        def repoMirrorOnlyRaw =
                providers.gradleProperty("repoMirrorOnly").orNull ?: System.getenv("GRADLE_REPO_MIRROR_ONLY")
        def repoMirrorOnly = (repoMirrorOnlyRaw ?: "false").toBoolean()

        if (repoMirrorUrl) {
            maven {
                url = uri(repoMirrorUrl)
                allowInsecureProtocol = repoMirrorUrl.startsWith("http://")
            }
        }

        if (!repoMirrorOnly) {
            google {
                content {
                    includeGroupByRegex("com\\.android.*")
                    includeGroupByRegex("com\\.google.*")
                    includeGroupByRegex("androidx.*")
                }
            }
            mavenCentral()
            gradlePluginPortal()
        }
    }
}
